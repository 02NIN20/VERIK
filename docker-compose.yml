services:
  postgres:
    image: postgres:16-alpine
    container_name: verik-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: verik
      POSTGRES_PASSWORD: verik
      POSTGRES_DB: verik
    ports:
      - "5432:5432"
    volumes:
      - verik_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verik -d verik"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: verik-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    profiles:
      - optional

volumes:
  verik_pgdata:
